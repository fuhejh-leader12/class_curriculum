<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課表通｜福和國中</title>
<meta name="description" content="新北市立福和國中課表查詢：輸入班級或老師姓名，立即查看每週課表。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B2420;
    --ink-soft: #4B564F;
    --ink-faint: #8B948B;
    --bg: #F3F5EF;
    --paper: #FFFFFF;
    --line: #E3E5DC;
    --line-strong: #C9CEC1;
    --pine: #20524A;
    --pine-dark: #163A34;
    --stamp: #B4483A;
    --day-mon: #D98A3D;
    --day-tue: #5E9375;
    --day-wed: #3F7CA6;
    --day-thu: #8C6CB0;
    --day-fri: #C85C74;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(27,36,32,0.04), 0 6px 20px -8px rgba(27,36,32,0.14);
  }

  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  button{ font-family: inherit; }

  .page{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ---------- Header ---------- */
  .topbar{
    padding: 28px 0 22px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .stamp{
    flex: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC", serif;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 1px;
    transform: rotate(-6deg);
    opacity: 0.92;
  }
  .brand-text h1{
    font-family:"Noto Serif TC", serif;
    font-weight: 800;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: 0.5px;
    color: var(--pine-dark);
  }
  .brand-text p{
    margin:0;
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.3px;
  }

  /* ---------- Search ---------- */
  .search-section{ position: relative; margin-bottom: 8px; }
  .search-label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .search-box{
    position: relative;
    display:flex;
    align-items:center;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .search-box:focus-within{ border-color: var(--pine); }
  .search-box svg{ flex:none; margin-left:18px; color: var(--ink-faint); }
  #search-input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    padding: 16px 12px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
  }
  #search-input::placeholder{ color: var(--ink-faint); }
  .clear-btn{
    flex:none;
    width:34px;height:34px;
    margin-right: 8px;
    border:0;
    border-radius:50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .clear-btn:hover{ background: var(--line); }

  .suggestions{
    margin-top: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .suggestion-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding: 12px 16px;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size: 15.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .suggestion-item:last-child{ border-bottom:0; }
  .suggestion-item:hover, .suggestion-item.active{ background: var(--bg); }
  .badge{
    flex:none;
    font-size: 11px;
    font-weight:700;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .badge.b-class{ background:#E6EFE9; color: var(--pine-dark); }
  .badge.b-teacher{ background:#F3E9DE; color:#8A5A2A; }
  .badge.b-elective{ background:#EFE6F1; color:#6B4A80; }
  .suggestion-item .s-sub{ margin-left:auto; font-size:12.5px; color: var(--ink-faint); }
  .no-result{ padding: 16px; color: var(--ink-faint); font-size: 14.5px; text-align:center; }

  .quick-browse{
    margin-top: 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .quick-label{ font-size: 13px; color: var(--ink-faint); margin-right:2px; }
  .chip{
    border: 1.5px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip:hover, .chip.active{ background: var(--pine); border-color: var(--pine); color:#fff; }

  .browse-list{
    margin-top: 14px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .browse-list button{
    border: 1px solid var(--line-strong);
    background: var(--paper);
    padding: 8px 13px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    color: var(--ink);
  }
  .browse-list button:hover{ border-color: var(--pine); color: var(--pine); }

  /* ---------- Result ---------- */
  .result{ margin-top: 30px; }
  .result-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .result-title-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .result-title{
    font-family:"Noto Serif TC", serif;
    font-weight:800;
    font-size: 28px;
    color: var(--pine-dark);
  }
  .result-meta{ font-size: 13.5px; color: var(--ink-faint); }
  .back-btn{
    border:0;
    background:none;
    color: var(--pine);
    font-weight:700;
    font-size: 14px;
    cursor:pointer;
    padding: 6px 0;
  }

  .week-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  @media (max-width: 700px){
    .week-grid{ grid-template-columns: 1fr; }
  }

  .day-col{
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow:hidden;
    border-top: 4px solid var(--day-c, var(--pine));
  }
  .day-col[data-day="0"]{ --day-c: var(--day-mon); }
  .day-col[data-day="1"]{ --day-c: var(--day-tue); }
  .day-col[data-day="2"]{ --day-c: var(--day-wed); }
  .day-col[data-day="3"]{ --day-c: var(--day-thu); }
  .day-col[data-day="4"]{ --day-c: var(--day-fri); }

  .day-title{
    margin:0;
    padding: 12px 16px 10px;
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size: 16px;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-title .today-mark{
    font-size: 10.5px;
    font-weight:700;
    color: var(--day-c);
    border:1px solid var(--day-c);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .period-list{ list-style:none; margin:0; padding: 0 10px 10px; display:flex; flex-direction:column; gap:6px; }
  .period-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding: 9px 6px;
    border-radius: var(--radius-sm);
  }
  .period-item:hover{ background: var(--bg); }
  .period-num{
    flex:none;
    width: 24px; height:24px;
    border-radius:50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    margin-top: 1px;
  }
  .period-info{ flex:1; min-width:0; }
  .period-line{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .subject{ font-weight:700; font-size: 15px; color: var(--ink); }
  .who{ font-size: 13px; color: var(--ink-soft); }
  .who.link{ cursor:pointer; text-decoration underline; }
  .who-btn{ border:0; background:none; padding:0; font: inherit; color: var(--pine); cursor:pointer; text-decoration: underline; text-underline-offset:2px; }
  .split-note{ font-size:11px; color: var(--ink-faint); margin-top:2px; }
  .day-empty{ padding: 14px 16px 18px; font-size: 13.5px; color: var(--ink-faint); }

  /* ---------- Empty / intro state ---------- */
  .empty-state{
    margin-top: 48px;
    text-align:center;
    color: var(--ink-faint);
    padding: 40px 20px;
  }
  .empty-state svg{ opacity:0.55; margin-bottom: 14px; }
  .empty-state p{ font-size: 14.5px; margin: 4px 0; }
  .empty-state .hint-strong{ color: var(--ink-soft); font-weight:600; }

  footer{
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-faint);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="stamp">福和</div>
    <div class="brand-text">
      <h1>課表通</h1>
      <p id="term-label">新北市立福和國中</p>
    </div>
  </header>

  <main>
    <section class="search-section">
      <label for="search-input" class="search-label">查詢班級或老師課表</label>
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="輸入班級（例如 701）或老師姓名" autocomplete="off" inputmode="search">
        <button id="clear-btn" class="clear-btn" aria-label="清除" hidden>×</button>
      </div>
      <div id="suggestions" class="suggestions" hidden></div>
      <div id="quick-browse" class="quick-browse">
        <span class="quick-label">快速瀏覽</span>
        <button class="chip" data-browse="7">七年級</button>
        <button class="chip" data-browse="8">八年級</button>
        <button class="chip" data-browse="9">九年級</button>
        <button class="chip" data-browse="elective">選修／技藝分組</button>
      </div>
      <div id="browse-list" class="browse-list" hidden></div>
    </section>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <div class="result-title-row">
          <span class="result-title" id="result-title"></span>
          <span class="result-meta" id="result-meta"></span>
        </div>
        <button class="back-btn" id="back-btn">← 重新查詢</button>
      </div>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <section id="empty-state" class="empty-state">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      <p class="hint-strong">輸入班級代碼或老師姓名開始查詢</p>
      <p>例如「701」「陳銓龍」，或點選上方快速瀏覽</p>
    </section>

    <footer>
      <p id="footer-note"></p>
    </footer>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
