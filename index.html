<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課表通｜福和國中</title>
<meta name="description" content="新北市立福和國中課表查詢：輸入班級或老師姓名，立即查看每週課表。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B2420;
    --ink-soft: #4B564F;
    --ink-faint: #8B948B;
    --bg: #F3F5EF;
    --paper: #FFFFFF;
    --line: #E3E5DC;
    --line-strong: #C9CEC1;
    --pine: #20524A;
    --pine-dark: #163A34;
    --stamp: #B4483A;
    --day-mon: #D98A3D;
    --day-tue: #5E9375;
    --day-wed: #3F7CA6;
    --day-thu: #8C6CB0;
    --day-fri: #C85C74;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(27,36,32,0.04), 0 6px 20px -8px rgba(27,36,32,0.14);
  }

  *{ box-sizing: border-box; }
  [hidden]{ display: none !important; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  button{ font-family: inherit; }

  .page{
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ---------- Header ---------- */
  .topbar{
    padding: 28px 0 22px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .stamp{
    flex: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC", serif;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 1px;
    transform: rotate(-6deg);
    opacity: 0.92;
  }
  .brand-text h1{
    font-family:"Noto Serif TC", serif;
    font-weight: 800;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: 0.5px;
    color: var(--pine-dark);
  }
  .brand-text p{
    margin:0;
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.3px;
  }

  /* ---------- Search ---------- */
  .search-section{ position: relative; margin-bottom: 8px; }
  .search-label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .search-box{
    position: relative;
    display:flex;
    align-items:center;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .search-box:focus-within{ border-color: var(--pine); }
  .search-box svg{ flex:none; margin-left:18px; color: var(--ink-faint); }
  #search-input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    padding: 16px 12px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
  }
  #search-input::placeholder{ color: var(--ink-faint); }
  .clear-btn{
    flex:none;
    width:34px;height:34px;
    margin-right: 8px;
    border:0;
    border-radius:50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .clear-btn:hover{ background: var(--line); }

  .suggestions{
    margin-top: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .suggestion-item{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding: 12px 16px;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size: 15.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .suggestion-item:last-child{ border-bottom:0; }
  .suggestion-item:hover, .suggestion-item.active{ background: var(--bg); }
  .badge{
    flex:none;
    font-size: 11px;
    font-weight:700;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .badge.b-class{ background:#E6EFE9; color: var(--pine-dark); }
  .badge.b-teacher{ background:#F3E9DE; color:#8A5A2A; }
  .badge.b-elective{ background:#EFE6F1; color:#6B4A80; }
  .suggestion-item .s-sub{ margin-left:auto; font-size:12.5px; color: var(--ink-faint); }
  .no-result{ padding: 16px; color: var(--ink-faint); font-size: 14.5px; text-align:center; }

  .quick-browse{
    margin-top: 16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .quick-label{ font-size: 13px; color: var(--ink-faint); margin-right:2px; }
  .chip{
    border: 1.5px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip:hover, .chip.active{ background: var(--pine); border-color: var(--pine); color:#fff; }

  .browse-list{
    margin-top: 14px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .browse-list button{
    border: 1px solid var(--line-strong);
    background: var(--paper);
    padding: 8px 13px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    color: var(--ink);
  }
  .browse-list button:hover{ border-color: var(--pine); color: var(--pine); }

  /* ---------- Compare panels ---------- */
  .result{ margin-top: 30px; }
  .compare-grid{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 860px){
    .compare-grid{ grid-template-columns: 1fr; }
    .swap-col{ order:2; margin: -4px 0; }
    #panel-right{ order:3; }
  }

  .swap-col{ display:flex; align-items:center; justify-content:center; height: 100%; padding-top: 46px; }
  .swap-btn{
    width:36px; height:36px;
    border-radius:50%;
    border: 1.5px solid var(--line-strong);
    background: var(--paper);
    color: var(--pine);
    font-size: 16px;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .swap-btn:hover{ border-color: var(--pine); }
  @media (max-width: 860px){
    .swap-btn{ transform: rotate(90deg); }
  }

  .panel{
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 16px 16px 18px;
    min-height: 220px;
  }
  .panel-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .panel-heading{ min-width:0; }
  .panel-title{
    font-family:"Noto Serif TC", serif;
    font-weight:800;
    font-size: 21px;
    color: var(--pine-dark);
    display:block;
    line-height:1.3;
  }
  .panel-meta{ font-size:12.5px; color: var(--ink-faint); }
  .panel-clear{
    flex:none;
    width:26px;height:26px;
    border:0;
    border-radius:50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-size:15px;
    cursor:pointer;
  }
  .panel-clear:hover{ background: var(--line); }

  .panel-placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: var(--ink-faint);
    padding: 34px 10px;
    font-size: 13.5px;
    gap:6px;
  }
  .panel-placeholder svg{ opacity:0.5; margin-bottom:4px; }
  .panel-placeholder .ph-strong{ color: var(--ink-soft); font-weight:600; font-size:14.5px; }

  .sched-table{
    width:100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .sched-table th{
    font-size: 12px;
    font-weight:700;
    color: var(--ink-soft);
    padding: 5px 2px 8px;
    border-bottom: 2px solid var(--line-strong);
    text-align:center;
  }
  .sched-table th.period-col{ width: 26px; }
  .sched-table th[data-today="1"]{ color: var(--pine-dark); }
  .sched-table th .today-dot{
    display:block;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--pine);
    margin: 3px auto 0;
  }
  .sched-table td{
    padding: 5px 3px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    text-align:center;
  }
  .sched-table td.period-cell{
    font-size:11px;
    font-weight:700;
    color: var(--ink-faint);
    padding-top: 8px;
  }
  .cell-empty{ color: var(--line-strong); font-size:12px; }
  .cell-entry{ margin: 0 0 4px; }
  .cell-entry:last-child{ margin-bottom:0; }
  .cell-subject{
    display:block;
    font-weight:700;
    font-size: 12.5px;
    color: var(--ink);
    line-height:1.25;
  }
  .cell-who{
    display:block;
    border:0; background:none; padding:0; margin-top:1px;
    font: inherit;
    font-size: 11px;
    color: var(--pine);
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    line-height:1.25;
  }
  .cell-week-tag{
    display:inline-block;
    font-size: 9.5px;
    color: var(--ink-faint);
    margin-right: 2px;
  }

  footer{
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-faint);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="stamp">福和</div>
    <div class="brand-text">
      <h1>課表通</h1>
      <p id="term-label">新北市立福和國中</p>
    </div>
  </header>

  <main>
    <section class="search-section">
      <label for="search-input" class="search-label">查詢班級或老師課表</label>
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="輸入班級（例如 701）或老師姓名" autocomplete="off" inputmode="search">
        <button id="clear-btn" class="clear-btn" aria-label="清除" hidden>×</button>
      </div>
      <div id="suggestions" class="suggestions" hidden></div>
      <div id="quick-browse" class="quick-browse">
        <span class="quick-label">快速瀏覽</span>
        <button class="chip" data-browse="7">七年級</button>
        <button class="chip" data-browse="8">八年級</button>
        <button class="chip" data-browse="9">九年級</button>
        <button class="chip" data-browse="elective">選修／技藝分組</button>
      </div>
      <div id="browse-list" class="browse-list" hidden></div>
    </section>

    <section id="result" class="result">
      <div class="compare-grid">
        <div class="panel" id="panel-left" data-side="left"></div>
        <div class="swap-col">
          <button id="swap-btn" class="swap-btn" title="交換左右" aria-label="交換左右兩側">⇄</button>
        </div>
        <div class="panel" id="panel-right" data-side="right"></div>
      </div>
    </section>

    <footer>
      <p id="footer-note"></p>
    </footer>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
